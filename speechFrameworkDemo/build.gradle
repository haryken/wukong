apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Để phát âm chuẩn như Xiaozhi_Android-main: build BẮT BUỘC không dùng -PskipNdk
// (chạy: gradlew assembleDebug   KHÔNG có -PskipNdk) → build libapp.so (native Opus) → âm to, rõ.
// Nếu build với -PskipNdk=true thì app dùng Concentus (Java) → âm nhỏ, dễ rè.
def skipNdkBuild = project.hasProperty('skipNdk') && project.property('skipNdk').toString().toBoolean()

android {
  compileSdkVersion 28
  if (!skipNdkBuild) {
    ndkVersion "29.0.14206865"
  }

  defaultConfig {
    applicationId "com.ubtrobot.mini.speech.framework.demo"
    minSdkVersion 24
    targetSdkVersion 28
    versionCode 1
    versionName "1.0"

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    if (!skipNdkBuild) {
      ndk {
        abiFilters 'arm64-v8a'
      }
      externalNativeBuild {
        cmake {
          cppFlags "-std=c++11"
        }
      }
    }
  }

  if (!skipNdkBuild) {
    externalNativeBuild {
      cmake {
        path "src/main/cpp/CMakeLists.txt"
        version "3.18.1"  // Cần 3.14+ cho FetchContent_MakeAvailable. Cài trong SDK Manager → SDK Tools → CMake 3.18.1 hoặc 3.22.1.
      }
    }
  }

  aaptOptions {
    // SoundPool/WakeupAudioPlayer needs raw files via openRawResourceFd - compressed assets fail
    noCompress 'mp3', 'onnx', 'model', 'txt'
  }

  buildTypes {
    debug {
      // AGP debug hay gắn testOnly=true → adb install lỗi INSTALL_FAILED_TEST_ONLY
      manifestPlaceholders = [testOnly: "false"]
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  packagingOptions {
    pickFirst 'lib/arm64-v8a/libtvad.so'
    pickFirst 'lib/armeabi-v7a/libtvad.so'
    // micrecord-sdk-release and weinalib-5.0.1 both ship libMNPCJni.so + com.mnano / net.mnano
    pickFirst 'lib/arm64-v8a/libMNPCJni.so'
    pickFirst 'lib/armeabi-v7a/libMNPCJni.so'
    pickFirst 'lib/armeabi/libMNPCJni.so'
    pickFirst 'lib/arm64-v8a/libsherpa-onnx-jni.so'
    jniLibs.useLegacyPackaging = true
  }

  compileOptions {
    sourceCompatibility 1.8
    targetCompatibility 1.8
  }

  kotlinOptions {
    jvmTarget = '1.8'
    freeCompilerArgs += ['-Xskip-metadata-version-check']
  }

  repositories{flatDir{dirs 'libs'}}
}

repositories {
  google()
  mavenCentral()
  flatDir { dirs 'libs' }
}

dependencies {
  // JAR outer SDK (mini-outer-sdk-lite.jar, protobuf, Msc, …)
  implementation fileTree(dir: 'libs', include: ['*.jar'])
  // Sauron (TakePicApi = com.ubtechinc.sauron.api): copy JAR/AAR từ gói UBT / mini-outer-sdk-demo vào libs/sauron/
  // (tách riêng để tránh fileTree *.aar trùng với các AAR đã implementation(name:…) trong libs/).
  def sauronDrop = file('libs/sauron')
  if (sauronDrop.isDirectory()) {
    implementation fileTree(dir: 'libs/sauron', include: ['*.jar', '*.aar'])
  }
  // AAR giống mini-outer-sdk-demo — chỉ thêm vào classpath nếu file tồn tại (tránh build fail khi chưa copy)
  // Do not add micrecord-sdk-release when weinalib is present: duplicate Java classes + libMNPCJni.so.
  def outerAars = ['phonecall-sdk-release']
  outerAars.each { base ->
    def f = file("libs/${base}.aar")
    if (f.exists()) {
      implementation(name: base, ext: 'aar')
    }
  }
  implementation 'androidx.appcompat:appcompat:1.3.1'
  testImplementation 'junit:junit:4.12'
  androidTestImplementation 'androidx.test:runner:1.5.2'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${rootProject.ext.kotlin_version}"

  // Coroutines & OkHttp for Xiaozhi integration (1.6.x for SharedFlow)
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
  implementation "com.squareup.okhttp3:okhttp:3.12.12"
  implementation "org.json:json:20180813"
  // QR Self-Control trên mắt (show_config_page)
  implementation "com.google.zxing:core:3.4.1"

  // Giống develop2222 / 2b23f8d: AAR speechFramework NGUYÊN (có MicrophoneArrayService thật) — mới đè được stock.
  implementation(name: 'speechFramework-oversea-release', ext: 'aar')
  implementation(name: 'behavior-lib-1.0.0', ext: 'aar')
  implementation(name: 'impl-wakeup-dingdang-1.0.0', ext: 'aar')
  implementation(name: 'sal-speech-1.0.0', ext: 'aar')
  implementation(name: 'tencent-vad-1.0.0', ext: 'aar')
  implementation(name: 'utillib-1.2.8', ext: 'aar')
  implementation(name: 'weinalib-5.0.1', ext: 'aar')

  //If you use WeiNa Wakeup Module, you need to configure the following dependencies
  implementation(name: 'wakeup-5.0.0', ext: 'aar')
  implementation "org.tensorflow:tensorflow-lite:1.12.0"

  // sherpa-onnx KWS – offline wake word on device (no Picovoice activation quota)
  implementation(name: 'sherpa-onnx-1.13.2', ext: 'aar')

  // Concentus: embedded source from lostromb/concentus (org.concentus) - no external JAR

  // MQTT + UDP — Eclipse Paho 1.1.1 (Java 8, tương thích AGP 4.2 + Jetifier; không dùng hannesa2 4.3)
  implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
  implementation('org.eclipse.paho:org.eclipse.paho.android.service:1.1.1') {
    exclude group: 'com.android.support', module: 'support-v4'
  }
  implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
}

// Ép merge JNI chạy sau native build (CMake) để libapp.so được gộp vào APK
afterEvaluate {
  def mergeJni = tasks.findByName('mergeDebugJniLibFolders')
  def nativeBuild = tasks.findByName('externalNativeBuildDebug')
  if (mergeJni != null && nativeBuild != null) {
    mergeJni.dependsOn(nativeBuild)
  }

  // AGP 4.2 debug gắn testOnly=true → patch file manifest trước khi đóng APK
  def patchDebugTestOnlyManifests = { String variantName ->
    ['merged_manifests', 'merged_manifest', 'packaged_manifests'].each { folder ->
      def manifest = file("${buildDir}/intermediates/${folder}/${variantName}/AndroidManifest.xml")
      if (manifest.exists()) {
        def text = manifest.getText('UTF-8')
        if (text.contains('android:testOnly="true"')) {
          manifest.write(text.replace('android:testOnly="true"', 'android:testOnly="false"'), 'UTF-8')
        }
      }
    }
  }

  android.applicationVariants.all { variant ->
    if (variant.buildType.name != 'debug') return
    def cap = variant.name.capitalize()
    def processManifest = tasks.findByName("process${cap}Manifest")
    if (processManifest != null) {
      processManifest.doLast {
        patchDebugTestOnlyManifests(variant.name)
        logger.lifecycle("Patched testOnly=false (${variant.name})")
      }
    }
    def packageTask = tasks.findByName("package${cap}")
    if (packageTask != null) {
      packageTask.doFirst { patchDebugTestOnlyManifests(variant.name) }
    }
  }
}
